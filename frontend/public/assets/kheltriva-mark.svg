<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
<title id="title">Kheltriva mark</title>
<desc id="desc">A blue K with a distinct white running footballer, green motion accent, and separate football.</desc>
<defs><linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<g transform="translate(8 12) scale(1.02)"><g>
  <!-- Bold, uncluttered K -->
  <path d="M18 18 H68 L48 68 L20 91 L7 145 Q5 154 15 154 H52 L72 112 L102 154 H151 L111 99 L148 22 Q151 14 141 14 H104 L72 66 L42 87 Z" fill="url(#brandBlue)"/>
  <!-- Motion accent stays behind and below the player -->
  <path d="M16 143 Q51 120 83 94 L125 54 Q104 91 77 113 Q47 136 16 143Z" fill="#16A34A"/>
  <!-- Simple, readable running footballer: separate shapes, no crossing ribbons -->
  <circle cx="91" cy="59" r="7" fill="#FFFFFF"/>
  <path d="M86 69 L99 72 L106 85 L99 91 L90 81 L81 94 L70 99 L65 93 L76 84 L78 74Z" fill="#FFFFFF"/>
  <path d="M83 74 L70 77 L59 87 L54 82 L66 69 L81 67Z" fill="#FFFFFF"/>
  <path d="M98 73 L110 70 L120 61 L125 66 L115 78 L102 82Z" fill="#FFFFFF"/>
  <path d="M91 89 L101 91 L108 103 L124 111 L120 117 L102 111 L90 101 L80 114 L69 127 L62 123 L73 106Z" fill="#FFFFFF"/>
  <path d="M84 90 L77 103 L66 110 L56 122 L49 118 L59 103 L72 91Z" fill="#FFFFFF"/>
  <!-- Distinct football, separated from the player -->
  <g transform="translate(126 0)">
    <circle cx="22" cy="22" r="19" fill="#FFFFFF" stroke="#172554" stroke-width="3"/>
    <path d="M22 13 L30 18 L27 28 L17 28 L14 18Z" fill="#172554"/>
    <path d="M22 13 L22 4 M30 18 L39 14 M27 28 L32 36 M17 28 L11 35 M14 18 L5 14" fill="none" stroke="#172554" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</g></g>
</svg>