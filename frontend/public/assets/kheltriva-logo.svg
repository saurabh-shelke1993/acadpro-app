<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
<title id="title">Kheltriva</title>
<desc id="desc">Kheltriva football academy management, featuring a bold K, yellow motion ribbon and football.</desc>
<rect x="8" y="8" width="884" height="214" rx="22" fill="#F8FAFC"/>
<svg x="28" y="10" width="185" height="210" viewBox="0 0 200 220" preserveAspectRatio="xMidYMid meet">

<defs>
  <linearGradient id="kBlue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0B397E"/><stop offset="1" stop-color="#164DA4"/>
  </linearGradient>
</defs>
<!-- Strong, readable geometric K -->
<path d="M22 12 H82 V70 L126 12 H184 L130 83 L191 160 H132 L92 108 L82 128 V160 H22 Z" fill="url(#kBlue)"/>
<!-- Yellow comet/ribbon sweeps from lower left and wraps around the football -->
<path d="M5 194 L63 105 C83 73 104 59 132 60 C164 61 187 83 187 111 C187 132 174 149 152 163 L72 207 L105 167 L5 194 Z" fill="#D4D400"/>
<!-- White inset around the ball keeps the football distinct from the yellow ribbon -->
<circle cx="133" cy="111" r="43" fill="#FFFFFF"/>
<circle cx="133" cy="111" r="36" fill="#FFFFFF" stroke="#0B397E" stroke-width="3.5"/>
<!-- Classic pentagon and stitched panels -->
<path d="M133 92 L148 103 L142 121 H124 L118 103 Z" fill="#0B397E"/>
<path d="M133 92 L133 76 M148 103 L164 98 M142 121 L152 137 M124 121 L114 137 M118 103 L102 98" fill="none" stroke="#0B397E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
<text x="235" y="122" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" letter-spacing="-3" fill="#0B397E">Khel<tspan fill="#2563EB">triva</tspan></text>
<text x="242" y="164" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#64748B">FOOTBALL ACADEMY MANAGEMENT</text>
</svg>