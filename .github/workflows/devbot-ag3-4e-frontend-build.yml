name: Kheltriva AG3.4E - Isolated frontend build validation

on:
  push:
    branches: [devbot-ag3-4e-frontend-build-only, payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag3-4e-frontend-build.yml'
  pull_request:
    branches: [payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag3-4e-frontend-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-build-only:
    name: Independent React build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies without lifecycle changes to project
        run: npm ci --no-audit --no-fund
      - name: Build with non-production placeholder credentials only
        env:
          CI: 'true'
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_KEY: ci-placeholder-key-not-for-deployment
        run: npm run build
      - name: Record scope
        if: always()
        working-directory: .
        run: |
          echo 'AG3.4E build is non-deploy validation with dummy keys.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full Jest regression is independently failing 16/490 tests; a green build does not clear production.' >> "$GITHUB_STEP_SUMMARY"
