name: HIGH-002 SEC-3 exact four-RPC patch real signed JWT regression (scratch)
on:
  pull_request:
    branches: [payment-module-finalization]
    paths:
      - 'scripts/devbot/sec3_high002_four_rpc_jwt_ci.py'
      - 'scripts/devbot/test_sec3_high002_four_rpc_jwt_ci.py'
      - 'supabase/review_only/HIGH002_FOUR_PAYMENT_RPC_FAIL_CLOSED_REVIEW_ONLY.sql'
      - 'frontend/docs/KHELTRIVA_HIGH002_SEC1_SEC2_REVIEW_20261113.md'
      - '.github/workflows/high002-sec3-four-rpc-real-jwt.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: high002-sec3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sec3-four-payment-rpcs:
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source/role/deny fail-closed harness checks
        run: python -m unittest discover -s scripts/devbot -p 'test_sec3_high002_four_rpc_jwt_ci.py' -v
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Bootstrap brand-new unlinked Supabase only inside runner temp
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init --yes >/dev/null 2>&1
          python - <<'PY'
          import tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path("supabase/config.toml").read_text())
          assert cfg["project_id"]=="kheltriva-ag34c2-ci"
          assert cfg["auth"]["email"]["enable_confirmations"] is False
          assert not Path("supabase/migrations").exists()
          assert not Path("supabase/.temp/project-ref").exists()
          PY
      - name: Start real local GoTrue/PostgREST in disposable native stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' > "$RUNNER_TEMP/high002-sec3-private-startup.log" 2>&1; then
            echo 'SEC-3 FAIL: native scratch startup; internal logs withheld'
            exit 1
          fi
      - name: Replay source-matched signed-JWT C2 role predicates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4c2_live_parent_policy_ci.py"
      - name: Replay source-matched D1 finance read policies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4d_finance_jwt_ci.py"
      - name: Replay original collect_payment and original-source exploit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4d3_collect_payment_jwt_ci.py"
      - name: Replay original three correction RPCs and original-source exploits
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4d32_correction_rpc_jwt_ci.py"
      - name: SEC-3 run EXACT SEC-2 four-RPC patch against signed JWTs and balances
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/sec3_high002_four_rpc_jwt_ci.py"
          echo 'SEC-3: four exact-source reviewed functions passed scratch signed JWT role/tenant and financial integrity. Live HIGH-002 remains OPEN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy disposable native stack, no persistent data
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if [ -f "$ROOT/supabase/config.toml" ]; then
            cd "$ROOT"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo 'HIGH-002 SEC-3 disposable teardown attempted'
