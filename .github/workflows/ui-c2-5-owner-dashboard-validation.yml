name: UI-C2.7 Academy Owner Dashboard Preview Validation
on:
  push:
    branches:
      - ui-c2-5-owner-dashboard-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-preview:
    name: CRA build and role-aware dashboard regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_KEY: ci-placeholder-key-not-for-deployment
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run focused UI-C2.7, UI-C2.5 and protected-route tests
        run: npm test -- --watchAll=false --runInBand --runTestsByPath src/components/Dashboard/AcademyOwnerDashboardC27.test.js src/components/Dashboard/AcademyOwnerDashboardC25.test.js src/components/ProtectedRoute.accessibility.test.js
      - name: Run complete frontend Jest suite
        run: npm test -- --watchAll=false --runInBand
      - name: Build actual Create React App frontend
        if: ${{ !cancelled() }}
        run: npm run build
