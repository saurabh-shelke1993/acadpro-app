name: Attendance AM1–AM7 validation

on:
  push:
    branches: [payment-module-finalization]
    paths:
      - 'frontend/src/routes/AppRoutes.js'
      - 'frontend/src/pages/AttendanceWorkspace.js'
      - 'frontend/src/pages/AttendanceWorkspace.test.js'
      - 'frontend/src/components/AttendanceWorkspaceTabs.js'
      - 'frontend/src/components/AttendanceWorkspaceTabs.css'
      - 'frontend/src/components/AttendanceWorkspaceTabs.test.js'
      - 'frontend/src/components/Sidebar.js'
      - 'frontend/src/components/Sidebar.test.js'
      - 'frontend/src/components/Sidebar.accessibility.test.js'
      - 'frontend/src/components/AttendanceRosterSummary.js'
      - 'frontend/src/pages/Attendance.css'
      - 'frontend/src/utils/attendancePresentation.js'
      - 'frontend/src/utils/attendancePresentation.test.js'
      - 'frontend/src/pages/Attendance.js'
      - 'frontend/src/pages/Attendance.test.js'
      - 'frontend/src/pages/CoachAttendance.js'
      - 'frontend/src/pages/CoachAttendance.test.js'
      - 'frontend/src/pages/AttendanceHistory.js'
      - 'frontend/src/pages/AttendanceHistory.css'
      - 'frontend/src/pages/AttendanceHistory.test.js'
      - 'frontend/src/pages/Dashboard.js'
      - 'frontend/src/pages/CoachDashboard.js'
      - 'frontend/src/components/Dashboard/AcademyOwnerDashboard.js'
      - 'frontend/src/services/attendanceService.js'
      - 'frontend/src/services/attendanceService.test.js'
      - 'frontend/src/services/attendanceHistoryService.js'
      - 'frontend/src/services/attendanceHistoryService.test.js'
      - 'frontend/src/utils/attendanceEditWindow.js'
      - 'frontend/src/utils/attendanceEditWindow.test.js'
      - '.github/workflows/attendance-am1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attendance-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run AM1–AM7 regression tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern='(AttendanceWorkspace|AttendanceWorkspaceTabs|Sidebar(?:\.accessibility)?|Attendance|CoachAttendance|AttendanceHistory|attendanceEditWindow|attendancePresentation|attendanceService|attendanceHistoryService)\.test\.js$'
      - name: Build React frontend
        env:
          CI: 'true'
        run: npm run build
