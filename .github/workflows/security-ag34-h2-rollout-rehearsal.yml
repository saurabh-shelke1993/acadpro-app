name: AG34-H2 Canonical Coach lockdown migration + emergency drill (scratch only)

on:
  push:
    branches: [security-ag34-h2-rollout-prep, payment-module-finalization]
    paths:
      - '.github/workflows/security-ag34-h2-rollout-rehearsal.yml'
      - 'scripts/devbot/ag34_h2_rollout_rehearsal_ci.py'
      - 'scripts/devbot/test_ag34_h2_rollout_rehearsal_ci.py'
      - 'scripts/devbot/ag34_h1_legacy_lockdown_ci.py'
      - 'scripts/devbot/ag3_4b_live_mapping_ci.py'
      - 'supabase/migrations/20261111165330_ag34_h1_legacy_coach_batches_client_lockdown.sql'
      - 'supabase/security_remediation_proposals/ag34_h1_legacy_coach_batches_lockdown.sql'
      - 'supabase/security_remediation_proposals/ag34_h2_emergency_grants_only_downshift.sql'
      - 'supabase/security_remediation_proposals/ag34_h2_read_only_hosted_preflight.sql'
      - 'supabase/security_remediation_proposals/ag34_h2_read_only_hosted_postflight.sql'
      - 'frontend/docs/AG3_4E_SECURITY_RELEASE_GATE.json'
  pull_request:
    branches: [payment-module-finalization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag34-h2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scratch-migration-forward-and-emergency:
    name: Signed JWT forward/downshift rehearsal; production stays NO-GO
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen source parity and NO-GO policy
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/devbot -p 'test_ag3_4b_live_mapping_ci.py' -v
          python -m unittest discover -s scripts/devbot -p 'test_ag34_h1_legacy_lockdown_ci.py' -v
          python -m unittest discover -s scripts/devbot -p 'test_ag34_h2_rollout_rehearsal_ci.py' -v
          python -m unittest discover -s scripts/devbot -p 'test_ag3_4e_security_release_gate.py' -v
          python scripts/devbot/ag3_4e_security_release_gate.py --check-no-go
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Prepare a new unlinked no-migration Supabase instance
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          ROOT="$RUNNER_TEMP/kheltriva-ag34b-ci"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init --yes >/dev/null
          python - <<'PY'
          from pathlib import Path
          import tomllib
          p=Path("supabase")
          config=tomllib.loads((p/"config.toml").read_text())
          assert config["project_id"]=="kheltriva-ag34b-ci"
          assert config["auth"]["email"]["enable_confirmations"] is False
          assert not (p/"migrations").exists()
          assert not (p/".temp"/"project-ref").exists()
          PY
          echo 'AG34-H2: isolated Supabase config verified'
      - name: Start native local GoTrue and PostgREST
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34b-ci"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' >"$RUNNER_TEMP/ag34-h2-private-startup.log" 2>&1; then
            echo 'AG34-H2 scratch Supabase startup failed; diagnostics withheld'
            exit 1
          fi
      - name: Run source-attested JWT forward migration and safe emergency drill
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34b-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag34_h2_rollout_rehearsal_ci.py"
      - name: Clean up scratch instance without backup
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/kheltriva-ag34b-ci"
          if [ -f "$ROOT/supabase/config.toml" ]; then
            cd "$ROOT"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo 'AG34-H2: scratch cleanup attempted; no hosted access'
