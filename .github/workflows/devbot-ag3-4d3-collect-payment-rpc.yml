name: Kheltriva AG3.4D3 - Real JWT collect_payment RPC invariants (scratch)
on:
  pull_request:
    branches: [payment-module-finalization]
    paths:
      - 'scripts/devbot/ag3_4d3_collect_payment_jwt_ci.py'
      - 'scripts/devbot/test_ag3_4d3_collect_payment_jwt_ci.py'
      - 'supabase/tests/security/ag34d3_collect_payment_rpc_scratch.sql'
      - 'supabase/tests/security/ag34d3_scratch_null_role_candidate.sql'
      - '.github/workflows/devbot-ag3-4d3-collect-payment-rpc.yml'
  push:
    branches: [security-ag34-d3-collect-payment-rpc-jwt, payment-module-finalization]
    paths:
      - 'scripts/devbot/ag3_4d3_collect_payment_jwt_ci.py'
      - 'scripts/devbot/test_ag3_4d3_collect_payment_jwt_ci.py'
      - 'supabase/tests/security/ag34d3_collect_payment_rpc_scratch.sql'
      - 'supabase/tests/security/ag34d3_scratch_null_role_candidate.sql'
      - '.github/workflows/devbot-ag3-4d3-collect-payment-rpc.yml'
permissions:
  contents: read
concurrency:
  group: kheltriva-ag34d3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpc-signed-jwt-payment:
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline fail-closed tests for source and JWT runner
        run: python -m unittest discover -s scripts/devbot -p 'test_ag3_4d3_collect_payment_jwt_ci.py' -v
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Bootstrap brand-new unlinked Supabase in runner temp
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init --yes >/dev/null 2>&1
          python - <<'PY'
          import tomllib
          from pathlib import Path
          root=Path("supabase")
          cfg=tomllib.loads((root/"config.toml").read_text())
          assert cfg["project_id"]=="kheltriva-ag34c2-ci"
          assert cfg["auth"]["email"]["enable_confirmations"] is False
          assert not (root/"migrations").exists()
          assert not (root/".temp"/"project-ref").exists()
          PY
      - name: Start native GoTrue PostgREST scratch stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' > "$RUNNER_TEMP/ag34d3-private-startup.log" 2>&1; then
            echo 'AG3.4D3 FAIL: local native startup; internal logs withheld'
            exit 1
          fi
      - name: Replay exact deployed C2 role predicates with signed JWTs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4c2_live_parent_policy_ci.py"
      - name: Replay deployed D1 finance read policy predicates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4d_finance_jwt_ci.py"
      - name: Exercise deployed collect_payment and number helper under real JWTs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4d3_collect_payment_jwt_ci.py"
          echo 'AG3.4D3: collect_payment ONLY; 13 RPCs, 16 Storage policies and hosted remediation still pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy disposable stack with no backup
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if [ -f "$ROOT/supabase/config.toml" ]; then
            cd "$ROOT"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo 'AG3.4D3 scratch teardown attempted'
