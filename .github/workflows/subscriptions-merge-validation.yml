name: Subscriptions SM2-SM3 validation

on:
  push:
    branches: [payment-module-finalization]
    paths:
      - 'frontend/src/routes/AppRoutes.js'
      - 'frontend/src/pages/SubscriptionsWorkspace.js'
      - 'frontend/src/pages/SubscriptionsWorkspace.test.js'
      - 'frontend/src/components/SubscriptionsWorkspaceTabs.js'
      - 'frontend/src/components/SubscriptionsWorkspaceTabs.css'
      - 'frontend/src/components/SubscriptionsWorkspaceTabs.test.js'
      - 'frontend/src/components/Sidebar.js'
      - 'frontend/src/components/Sidebar.test.js'
      - 'frontend/src/pages/SubscriptionPlans.js'
      - 'frontend/src/pages/SubscriptionPlans.css'
      - 'frontend/src/pages/SubscriptionPlans.test.js'
      - 'frontend/src/pages/PlayerSubscriptions.js'
      - 'frontend/src/pages/PlayerSubscriptions.css'
      - 'frontend/src/pages/PlayerSubscriptions.test.js'
      - 'frontend/src/components/SubscriptionFeePreview.js'
      - 'frontend/src/components/SubscriptionFeePreview.css'
      - 'frontend/src/components/SubscriptionFeePreview.test.js'
      - 'frontend/src/utils/subscriptionLifecycleDates.js'
      - 'frontend/src/utils/subscriptionLifecycleDates.test.js'
      - 'frontend/src/utils/subscriptionCalendarEndDate.js'
      - 'frontend/src/utils/subscriptionCalendarEndDate.test.js'
      - 'frontend/src/utils/subscriptionOneTimeCampPeriod.js'
      - 'frontend/src/utils/subscriptionOneTimeCampPeriod.test.js'
      - 'frontend/src/utils/subscriptionProration.js'
      - 'frontend/src/utils/subscriptionProration.test.js'
      - '.github/workflows/subscriptions-merge-validation.yml'
  pull_request:
    branches: [payment-module-finalization]
    paths:
      - 'frontend/src/pages/PlayerSubscriptions.js'
      - 'frontend/src/pages/PlayerSubscriptions.css'
      - 'frontend/src/pages/PlayerSubscriptions.test.js'
      - 'frontend/src/pages/SubscriptionPlans.js'
      - 'frontend/src/pages/SubscriptionPlans.css'
      - 'frontend/src/pages/SubscriptionPlans.test.js'
      - 'frontend/src/components/SubscriptionFeePreview.js'
      - 'frontend/src/components/SubscriptionFeePreview.test.js'
      - 'frontend/src/utils/subscriptionCalendarEndDate.js'
      - 'frontend/src/utils/subscriptionCalendarEndDate.test.js'
      - 'frontend/src/utils/subscriptionOneTimeCampPeriod.js'
      - 'frontend/src/utils/subscriptionOneTimeCampPeriod.test.js'
      - '.github/workflows/subscriptions-merge-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscriptions-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Subscriptions workspace tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=SubscriptionsWorkspace
      - name: Run Sidebar regression tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=Sidebar
      - name: Run Player Subscriptions PS1 tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=PlayerSubscriptions.test.js
      - name: Run Subscription Plans SP1 tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=SubscriptionPlans.test.js
      - name: Run PS-L1 date-only lifecycle unit tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=subscriptionLifecycleDates.test.js
      - name: Run RC1.3 calendar-aligned end date tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=subscriptionCalendarEndDate.test.js
      - name: Run SP2 One-time camp date validation tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=subscriptionOneTimeCampPeriod.test.js
      - name: Run PS-L1P1 monthly proration calculator tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=subscriptionProration.test.js
      - name: Run PS-L1P2 read-only quote preview tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --testPathPattern=SubscriptionFeePreview.test.js
      - name: Build React frontend
        env:
          CI: 'true'
        run: npm run build
