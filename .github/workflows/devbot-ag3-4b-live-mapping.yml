name: Kheltriva DevBot AG3.4B - Live Coach mapping RLS parity

on:
  push:
    branches: [devbot-ag3-4b-live-coach-mapping-parity, payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag3-4b-live-mapping.yml'
      - 'scripts/devbot/ag3_4b_live_mapping_ci.py'
      - 'scripts/devbot/test_ag3_4b_live_mapping_ci.py'
      - 'supabase/tests/security/ag34b_live_coach_batches_policy_snapshot.sql'
      - 'supabase/tests/security/ag34b_scratch_role_gated_candidate.sql'
      - 'scripts/devbot/ag3_3_parent_sa_jwt_rls_ci.py'
      - 'scripts/devbot/ag3_2_coach_jwt_rls_ci.py'
      - 'scripts/devbot/ag3_real_jwt_rls_ci.py'
      - 'scripts/devbot/ag2_real_auth_ci.py'
      - 'supabase/tests/subscriptions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kheltriva-ag34b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scratch-live-predicate-replay:
    name: AG3.4B real JWT Coach mapping policy replay
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure security, SQL and assertion guards
        run: python -m unittest discover -s scripts/devbot -p 'test_ag3_4b_live_mapping_ci.py' -v
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Create fresh unlinked no-migration Supabase
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kheltriva-ag34b-ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init --yes >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import tomllib
          root=Path('supabase')
          config=tomllib.loads((root/'config.toml').read_text())
          assert config['project_id']=='kheltriva-ag34b-ci'
          assert config['auth']['email']['enable_confirmations'] is False
          assert not (root/'migrations').exists()
          assert not (root/'.temp'/'project-ref').exists()
          PY
          echo 'AG3.4B PASS: unlinked disposable project only.'
      - name: Start native local GoTrue PostgREST and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34b-ci"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' >"$RUNNER_TEMP/ag34b-private-startup.log" 2>&1; then
            echo 'AG3.4B FAIL: scratch Supabase startup; secrets withheld.'
            exit 1
          fi
          echo 'AG3.4B PASS: native Auth and PostgREST started.'
      - name: Test live policy parity and scratch-only role-gated candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34b-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4b_live_mapping_ci.py"
      - name: Destroy scratch Supabase without backup
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/kheltriva-ag34b-ci"
          if [ -f "$ROOT/supabase/config.toml" ]; then
            cd "$ROOT"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo 'AG3.4B disposable cleanup attempted.'
