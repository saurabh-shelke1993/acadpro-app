name: PS-L2.3B recovery evidence tests

on:
  push:
    branches: [payment-module-finalization]
    paths:
      - 'supabase/recovery/historical-baseline/**'
      - '.github/workflows/subscriptions-ps-l2-3-recovery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-export-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify recovery exporter and integrity guards
        run: |
          python -m unittest discover -s supabase/recovery/historical-baseline -p 'test_*.py' -v
          python -m py_compile supabase/recovery/historical-baseline/export_migrations.py supabase/recovery/historical-baseline/analyze_replay_dependencies.py supabase/recovery/historical-baseline/compare_migration_content.py supabase/recovery/historical-baseline/build_review_candidate.py supabase/recovery/historical-baseline/inspect_historical_statements.py supabase/recovery/historical-baseline/attest_private_archive.py supabase/recovery/historical-baseline/run_verified_private_archive.py
      - name: Validate blocked review candidate against actual metadata evidence
        run: |
          python supabase/recovery/historical-baseline/build_review_candidate.py \
            --parity supabase/recovery/historical-baseline/parity-fingerprints-readonly-20261109.json \
            --review supabase/recovery/historical-baseline/review-queue-readonly-20261110.json \
            --output /tmp/ps-l2-3b-disposable-review-candidate.json
          python - <<'PY'
          import json
          with open('/tmp/ps-l2-3b-disposable-review-candidate.json', encoding='utf-8') as file:
              candidate = json.load(file)
          assert candidate['remote_migrations'] == 82
          assert candidate['ready_for_disposable_replay'] is False
          assert candidate['ready_for_production'] is False
          assert candidate['sql_embedded'] is False
          assert all(row['manual_review_status'] == 'PENDING'
                     for row in candidate['ordered_historical_records'])
          print('B2.5 review candidate correctly BLOCKED; no executable SQL generated')
          PY
      - name: Validate read-only historical SQL risk screening metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path(
              'supabase/recovery/historical-baseline/statement-risk-screen-readonly-20261110.json'
          ).read_text(encoding='utf-8'))
          assert evidence['summary']['remote_migrations'] == 82
          assert evidence['summary']['stored_statement_entries'] == 168
          assert evidence['summary']['direct_data_mutation_migrations'] == 11
          assert evidence['summary']['direct_data_mutation_statements'] == 20
          assert all(r['safe_to_replay'] is False for r in evidence['records'])
          assert all(r['review_status'] == 'PENDING' for r in evidence['records'])
          print('Historical SQL review evidence remains pending and non-executable')
          PY
