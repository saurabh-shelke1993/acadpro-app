name: Kheltriva AG3.4C2 - Exact Parent Coach SA SELECT live parity

on:
  push:
    branches: [devbot-ag3-4c2-native-parent-policy-parity, payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag3-4c2-parent-policy.yml'
      - 'scripts/devbot/ag3_4c2_live_parent_policy_ci.py'
      - 'scripts/devbot/test_ag3_4c2_live_parent_policy_ci.py'
      - 'supabase/tests/security/ag34c2_live_parent_coach_sa_select.sql'
      - 'scripts/devbot/ag3_4b_live_mapping_ci.py'
      - 'scripts/devbot/ag3_3_parent_sa_jwt_rls_ci.py'
      - 'scripts/devbot/ag3_2_coach_jwt_rls_ci.py'
      - 'scripts/devbot/ag3_real_jwt_rls_ci.py'
      - 'scripts/devbot/ag2_real_auth_ci.py'
      - 'supabase/tests/subscriptions/**'
  pull_request:
    branches: [payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag3-4c2-parent-policy.yml'
      - 'scripts/devbot/ag3_4c2_live_parent_policy_ci.py'
      - 'scripts/devbot/test_ag3_4c2_live_parent_policy_ci.py'
      - 'supabase/tests/security/ag34c2_live_parent_coach_sa_select.sql'

permissions:
  contents: read

concurrency:
  group: kheltriva-ag34c2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parent-live-jwt:
    name: AG3.4C2 exact SELECT source + signed JWT
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure AG3.4C2 SQL and runner guard tests
        run: python -m unittest discover -s scripts/devbot -p 'test_ag3_4c2_live_parent_policy_ci.py' -v
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Prepare new unlinked native Supabase
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          supabase init --yes >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import tomllib
          root=Path('supabase')
          config=tomllib.loads((root/'config.toml').read_text())
          assert config['project_id']=='kheltriva-ag34c2-ci'
          assert config['auth']['email']['enable_confirmations'] is False
          assert not (root/'migrations').exists()
          assert not (root/'.temp'/'project-ref').exists()
          PY
      - name: Launch local GoTrue and PostgREST
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' > "$RUNNER_TEMP/ag34c2-private-startup.log" 2>&1; then
            echo 'AG3.4C2 FAIL: disposable native startup, logs withheld'
            exit 1
          fi
      - name: Source-exact Parent active Coach SA JWT authorization
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kheltriva-ag34c2-ci"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag3_4c2_live_parent_policy_ci.py"
      - name: Destroy scratch Supabase
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/kheltriva-ag34c2-ci"
          if [ -f "$ROOT/supabase/config.toml" ]; then
            cd "$ROOT"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo 'AG3.4C2 disposal attempted'
