name: AG34-H4 Hosted release preparer static safety (NO remote execution)

on:
  push:
    branches: [security-ag34-h4-hosted-release-preflight, payment-module-finalization]
    paths:
      - '.github/workflows/security-ag34-h4-release-preparation.yml'
      - 'scripts/devbot/ag34_h4_prepare_hosted_release.ps1'
      - 'scripts/devbot/test_ag34_h4_prepare_hosted_release.py'
      - 'scripts/devbot/ag34_h3_operator_workspace_gate.py'
  pull_request:
    branches: [payment-module-finalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check private backup, fetch-only flow and no remote mutating command
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/devbot -p 'test_ag34_h4_prepare_hosted_release.py' -v
          python -m unittest discover -s scripts/devbot -p 'test_ag34_h3_operator_workspace_gate.py' -v
          python scripts/devbot/ag3_4e_security_release_gate.py --check-no-go
      - name: PowerShell syntax parse ONLY; never run the script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/devbot/ag34_h4_prepare_hosted_release.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw 'AG34-H4 PowerShell release-preparation syntax invalid'
          }
      - name: Record zero-credential deployment boundary
        run: |
          echo 'AG34-H4 CI is static only: no Supabase credentials, no backup fetch, no live SQL, no migration up.' >> "$GITHUB_STEP_SUMMARY"
