name: Phase 7.5 - Frontend validation

on:
  push:
    branches:
      - payment-module-finalization
    paths:
      - "frontend/**"
      - ".github/workflows/phase-7-5-validation.yml"
  workflow_dispatch:

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Jest test suite
        env:
          CI: "true"
          # Non-production placeholders: tests must not require production credentials.
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_KEY: ci-placeholder-key-not-for-deployment
        run: npm test -- --watchAll=false
      - name: Create production build
        env:
          CI: "true"
          # This build is a validation artifact only and is not deployed.
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_KEY: ci-placeholder-key-not-for-deployment
        run: npm run build
