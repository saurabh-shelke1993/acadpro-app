name: Kheltriva DevBot AG2 - Native local Supabase Auth

on:
  push:
    branches: [devbot-ag2-real-auth, payment-module-finalization]
    paths:
      - '.github/workflows/devbot-ag2-real-auth.yml'
      - 'scripts/devbot/ag2_real_auth_ci.py'
      - 'scripts/devbot/test_ag2_real_auth_ci.py'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_c3_native_schema.sql'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_c33b_precheck.sql'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_live_helper_snapshot.sql'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_c33b_postcheck.sql'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_c34b1_owner_a_mapping.sql'
      - 'supabase/tests/subscriptions/ps_l2_3_b2_9_c34b2_owner_b_mapping.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kheltriva-ag2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-local-auth:
    name: AG2 real GoTrue sessions and synthetic owner mappings
    if: github.repository == 'saurabh-shelke1993/acadpro-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AG2_DIR: ${{ runner.temp }}/kheltriva-ag2-ci
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static guards for unlinked real GoTrue driver
        run: python -m unittest discover -s scripts/devbot -p 'test_ag2_real_auth_ci.py' -v
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Generate fresh unlinked local config in CI-only directory
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test ! -e "$AG2_DIR"
          mkdir -p "$AG2_DIR"
          cd "$AG2_DIR"
          supabase init --yes > /dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import tomllib
          conf = Path('supabase/config.toml')
          settings = tomllib.loads(conf.read_text())
          assert settings['project_id'] == 'kheltriva-ag2-ci'
          assert settings['auth']['email']['enable_confirmations'] is False
          assert not Path('supabase/migrations').exists()
          assert not Path('supabase/.temp/project-ref').exists()
          PY
          echo 'AG2 PASS: disposable unlinked project; zero historical migration files.'
      - name: Start native Supabase Auth / Kong / Postgres (no hosted services)
        shell: bash
        run: |
          set -euo pipefail
          cd "$AG2_DIR"
          if ! supabase start -x 'realtime,storage-api,studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,supavisor,mailpit' > "$RUNNER_TEMP/ag2-startup-private.log" 2>&1; then
            echo 'AG2 FAIL: isolated local Supabase start failed. Raw CLI log withheld.'
            exit 1
          fi
          echo 'AG2 PASS: native GoTrue and local PostgreSQL started.'
      - name: Run GoTrue-issued Auth, negative JWT and owner mapping tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$AG2_DIR"
          python "$GITHUB_WORKSPACE/scripts/devbot/ag2_real_auth_ci.py"
      - name: Stop disposable Supabase without backup
        if: always()
        shell: bash
        run: |
          if [ -f "$AG2_DIR/supabase/config.toml" ]; then
            cd "$AG2_DIR"
            supabase stop --no-backup > /dev/null 2>&1 || true
          fi
          echo 'AG2 cleanup attempted; ephemeral runner discarded after job.'
